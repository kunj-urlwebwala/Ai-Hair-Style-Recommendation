openapi: 3.1.0
info:
  title: Mirror AI Hairstyle MVP API
  version: 1.0.0-mvp
  description: |
    Node.js REST API for an India-focused hairstyle consultation and hairstyle-only virtual try-on MVP.
    Portrait analysis and preview generation are best-effort visual guidance. The service instructs AI providers to preserve the original face and identity while changing only hair.
    AI endpoints require a signed-in account: pass the session cookie or an `Authorization: Bearer <token>` header.
servers:
  - url: https://api.example.com/api/v1
    description: Replace with the deployed Mirror Node API URL.
paths:
  /health:
    get:
      summary: Check API availability
      operationId: getHealth
      responses:
        "200":
          description: API is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /hairstyle/consultations:
    post:
      summary: Create an Indian-context hairstyle consultation
      operationId: createConsultation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationRequest"
      responses:
        "201":
          description: Consultation was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: Portrait framing is too close or does not show enough hair for a hairstyle-only preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/AiProviderError"
  /hairstyle/saved-looks:
    get:
      summary: List the signed-in customer's saved looks
      operationId: listSavedLooks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved looks ordered newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedLooksResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Save a generated preview to the customer's shortlist
      operationId: createSavedLook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedLookRequest"
      responses:
        "201":
          description: Look was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedLookResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /hairstyle/saved-looks/{id}:
    delete:
      summary: Remove a saved look
      operationId: deleteSavedLook
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Look was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such saved look for this account.
  /hairstyle/try-ons:
    post:
      summary: Generate a hairstyle-only virtual try-on
      operationId: createTryOn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TryOnRequest"
      responses:
        "201":
          description: Virtual try-on was generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryOnResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/AiProviderError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: No session or an expired session. Sign in again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: The account reached its daily limit for this feature.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request body or field validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request payload exceeds the API body limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AiProviderError:
      description: A configured analysis or image-generation provider could not return a usable result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ImageInput:
      type: object
      required: [base64, mimeType]
      properties:
        base64:
          type: string
          minLength: 100
          description: JPEG, PNG, or WebP image bytes encoded as base64 without a data URI prefix. Decoded file limit is 10 MB.
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    CustomerRequirements:
      type: object
      properties:
        prompt:
          type: string
          maxLength: 500
          example: I want a polished low-maintenance professional look with short hair.
        occasion:
          type: string
          enum: [everyday, professional, festive, wedding, other]
        lengthPreference:
          type: string
          enum: [short, medium, long, open]
        maintenancePreference:
          type: string
          enum: [low, medium, high, open]
    ConsultationRequest:
      type: object
      required: [image]
      properties:
        image:
          $ref: "#/components/schemas/ImageInput"
        requirements:
          $ref: "#/components/schemas/CustomerRequirements"
    StyleAnalysis:
      type: object
      required:
        [faceShape, overview, featureNotes, stylePrinciples, confidenceNote]
      properties:
        faceShape: { type: string }
        overview: { type: string }
        featureNotes:
          type: array
          items: { type: string }
        stylePrinciples:
          type: array
          items: { type: string }
        confidenceNote: { type: string }
    HairstyleRecommendation:
      type: object
      required:
        [id, name, description, whyItWorks, maintenance, texture, tone, prompt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        whyItWorks: { type: string }
        maintenance: { type: string, enum: [Low, Medium, High] }
        texture: { type: string }
        tone: { type: string }
        prompt:
          type: string
          description: Server-constrained hairstyle-only edit instruction.
    Consultation:
      type: object
      required:
        [
          id,
          sourceImageUrl,
          requirements,
          portraitCheck,
          analysis,
          recommendations,
        ]
      properties:
        id: { type: string, example: con_9b9c3d1e }
        sourceImageUrl: { type: string, format: uri }
        requirements:
          $ref: "#/components/schemas/CustomerRequirements"
        analysisModel:
          type: string
          description: The configured primary or fallback multimodal model that produced the analysis.
        portraitCheck:
          $ref: "#/components/schemas/PortraitCheck"
        analysis:
          $ref: "#/components/schemas/StyleAnalysis"
        recommendations:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/HairstyleRecommendation"
    Meta:
      type: object
      required: [requestId, apiVersion]
      properties:
        requestId: { type: string }
        apiVersion: { type: string, example: v1 }
    ConsultationResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [consultation]
          properties:
            consultation:
              $ref: "#/components/schemas/Consultation"
        meta:
          $ref: "#/components/schemas/Meta"
    TryOnRequest:
      type: object
      required: [sourceImageUrl, mimeType, style]
      properties:
        sourceImageUrl: { type: string, format: uri }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        style:
          type: object
          required: [name, prompt]
          properties:
            id: { type: string }
            name: { type: string, minLength: 2, maxLength: 80 }
            prompt: { type: string, minLength: 10, maxLength: 900 }
    TryOn:
      type: object
      required: [id, previewImageUrl, preservation]
      properties:
        id: { type: string, example: try_9b9c3d1e }
        previewImageUrl: { type: string, format: uri }
        generationModel:
          type: string
          description: The primary or fallback image-edit model that produced the preview.
        preservation:
          type: object
          required: [target, note]
          properties:
            target: { type: string, example: hairstyle_only }
            note: { type: string }
    TryOnResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [tryOn]
          properties:
            tryOn:
              $ref: "#/components/schemas/TryOn"
        meta:
          $ref: "#/components/schemas/Meta"
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          properties:
            status: { type: string, example: ok }
            service: { type: string, example: mirror-hairstyle-mvp }
        meta:
          $ref: "#/components/schemas/Meta"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            requestId: { type: string }
            details: { type: object }
    PortraitCheck:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [ready, retake] }
        message: { type: string }
    SavedLookRequest:
      type: object
      required: [consultationId, recommendation, previewImageUrl]
      properties:
        consultationId:
          type: string
          description: Must be a consultation created by this account.
          example: con_9b9c3d1e
        recommendation:
          $ref: "#/components/schemas/HairstyleRecommendation"
        previewImageUrl:
          type: string
          format: uri
          description: A /uploads/generated/ preview URL returned by the try-on endpoint.
    SavedLookResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [look]
          properties:
            look:
              $ref: "#/components/schemas/SavedLook"
        meta:
          $ref: "#/components/schemas/Meta"
    SavedLooksResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [looks]
          properties:
            looks:
              type: array
              items:
                $ref: "#/components/schemas/SavedLook"
        meta:
          $ref: "#/components/schemas/Meta"
    SavedLook:
      type: object
      required: [id, consultationId, recommendation, previewImageUrl, createdAt]
      properties:
        id: { type: string, example: look_9b9c3d1e2f3a4b5c }
        consultationId: { type: string }
        recommendation:
          $ref: "#/components/schemas/HairstyleRecommendation"
        previewImageUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
